name: Publish multi-arch container image

# ---------------------------------------------------------------------------
# fork 自有文件（新增路径，L0）。不改动上游任何文件，因此不参与上游同步的
# 冲突判定：merge upstream 时永远碰不到这个文件。
#
# 背景：上游 .github/workflows/docker-publish.yml 只构建 linux/amd64。
# 本 workflow 复用同一份上游 Dockerfile，额外构建 linux/arm64（平台可配），
# 产出多架构 manifest 并推送到本 fork 的 GHCR。
#
# 用法：Actions -> "Publish multi-arch container image" -> Run workflow
#       version 填上游 tag（如 v2.2.12）。fork 里没有该 tag 时会自动从上游
#       拉取，不需要在 fork 里补 tag。
#
# 注意：在本 fork 发镜像请用本 workflow。上游的 "Create release" 会调用
#       docker-publish.yml（仅 amd64），会用单架构 manifest 覆盖同名 tag。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的 tag，例如 v2.2.12（fork 缺该 tag 时自动从上游拉取）"
        required: true
        type: string
      update_latest:
        description: "是否同时移动 latest 标签"
        required: false
        default: true
        type: boolean
      platforms:
        description: "目标平台，逗号分隔"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-multiarch-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: wicm84266964/Buddy2api

jobs:
  publish:
    name: publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and checkout source commit
        id: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version 必须形如 v1.2.3 或 v1.2.3-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "tag ${VERSION} 已存在于本 fork"
          else
            echo "fork 中无 tag ${VERSION}，从上游 ${UPSTREAM_REPO} 拉取"
            fetched=false
            for _ in 1 2 3 4 5; do
              if git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
                   "refs/tags/${VERSION}:refs/tags/${VERSION}"; then
                fetched=true
                break
              fi
              sleep 5
            done
            if [[ "$fetched" != "true" ]]; then
              echo "::error::无法从上游获取 tag ${VERSION}"
              exit 1
            fi
          fi
          sha="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          git checkout --detach "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "构建源码 commit: ${sha}"

      - name: Require tag to match version.py
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          code_version="$(tr -d '\r' < version.py | sed -n 's/^VERSION = "\(.*\)"$/\1/p')"
          if [[ "$VERSION" != "v${code_version}" ]]; then
            echo "::error::version.py 是 ${code_version}，与 ${VERSION} 不一致"
            exit 1
          fi
          echo "version.py = ${code_version}"

      - name: Resolve image tags
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${VERSION}"
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          printf '%s\n' "$tags" > "$RUNNER_TEMP/image-tags.txt"
          {
            echo "image=${image}"
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.title=buddy2api
            org.opencontainers.image.description=Local OpenAI-compatible gateway for personal AI client sessions

      - name: Summarize published tags
        run: |
          set -euo pipefail
          {
            echo "### GHCR image"
            echo '```'
            cat "$RUNNER_TEMP/image-tags.txt"
            echo '```'
            echo
            echo "Platforms: ${{ inputs.platforms }}"
            echo "Source commit: ${{ steps.src.outputs.sha }}"
            echo
            echo "首次推送会创建 private package，需要在 GitHub 上把该 package 改为 public 才能匿名 docker pull。"
          } >> "$GITHUB_STEP_SUMMARY"
